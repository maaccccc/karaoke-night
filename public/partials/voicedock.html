<div id="vcDock" aria-label="Voice chat">
  <div id="vcPanel" hidden role="dialog" aria-label="Voice chat">
    <div class="vcph"><b>🎧 Voice chat</b><button class="ghost mini" id="vcMin" type="button" aria-label="Minimise voice chat">–</button></div>
<div id="vcBox">
    <div class="row"><button id="vcJoin">🎧 Join voice chat</button><button class="ghost" id="vcMute" style="display:none">🎙 Mute</button></div>
    <div id="vcPeers" aria-live="polite"></div>
    <p class="note" id="vcHint" style="display:none;margin:4px 0 0">Tip: hover or click a person to change how loud they are for you (right-click works too; press and hold on a phone).</p>
    <label id="vcMasterRow" style="display:none">Voice chat volume (everyone) <b id="vcMasterV"></b><input type="range" id="vcMaster" min="0" max="200" step="5"></label>
    <label id="vcDuckRow" style="display:none">Voice chat volume while someone sings <b id="vcDuckV"></b><input type="range" id="vcDuck" min="0" max="100" step="5"></label>
    <p class="note" id="vcNote">Talk with everyone in the room, even during songs (at a lower volume so the singer stays clear). Headphones avoid echo.</p>
  </div>
  </div>
  <button id="vcHead" type="button" aria-label="Voice chat" aria-expanded="false" title="Voice chat (drag me anywhere)"><span class="vcico">🎧</span><span class="vcbd" id="vcBd"></span></button>
</div>
