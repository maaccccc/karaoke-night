<header class="top"><h1><img class="logo" src="img/logo-mark.svg" alt="" width="30" height="30">Karaoke Night</h1>
  <button class="ghost icon" id="roomBtn" style="display:none" aria-label="Copy invite link">🌐 Room</button>
  <span class="grow"></span>
  <button class="ghost icon" id="sideToggle" aria-label="Show lobby and queue">Queue (<b id="qCount">0</b>)</button>
  <button class="ghost icon" id="gear" aria-label="Settings"><span aria-hidden="true">⚙</span><span class="lbl"> Settings</span></button>
  <button class="ghost icon" id="homeBtn" aria-label="Leave to home"><span aria-hidden="true">🏠</span><span class="lbl"> Leave</span></button>
  <div class="moreWrap">
    <button class="ghost icon" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-label="More options">⋯<span class="lbl"> More</span></button>
    <div class="moreMenu" id="moreMenu" role="menu" hidden>
      <button class="ghost icon" data-mine role="menuitem">⭐ My songs</button>
      <button class="ghost icon" id="testBtn" role="menuitem">🎤 Mic test</button>
      <button class="ghost icon" data-help role="menuitem">❓ How it works</button>
    </div>
  </div>
  <div class="eq" id="eq" aria-hidden="true"></div></header>
