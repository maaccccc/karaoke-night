<!-- decorative layer: purely visual, hidden from screen readers; see css/premium.css and js/premium.js -->
<canvas id="fxDust" aria-hidden="true"></canvas>
<div class="curtain-open" aria-hidden="true"><i></i><i></i></div>
<script>/* opening curtains: play once when the site is first opened, then delete them so the Home button never replays them */
(function(){var c=document.querySelector('.curtain-open');if(!c)return;
if(!document.body.classList.contains('home')||matchMedia('(prefers-reduced-motion:reduce)').matches){c.remove();return}
c.classList.add('play');var kill=function(){c.remove()};
c.addEventListener('animationend',function(e){if(e.target===c)kill()});setTimeout(kill,4500)})();</script>
<div class="curtains" aria-hidden="true"><i></i><i></i></div>
<div class="vinyl" aria-hidden="true"><b></b></div>
<div class="discoball" aria-hidden="true"><u></u><i></i></div>
<aside class="mic3d hero" id="micHero" tabindex="0" role="img" aria-label="Decorative spinning microphone. Drag it sideways to spin it faster, or press Space.">
  <div class="mglow"></div><div class="scene"><div class="mic"></div></div><div class="pedestal"></div>
  <span class="mhint">Drag to spin</span><span class="rpm" aria-hidden="true"></span>
</aside>
