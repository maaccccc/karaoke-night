<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Karaoke Night logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1245"/><stop offset="1" stop-color="#150a22"/></linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3d8b"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffb02e"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff3d8b" stop-opacity=".45"/><stop offset="1" stop-color="#ff3d8b" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <circle cx="140" cy="118" r="100" fill="url(#glow)"/>
  <!-- crescent moon (the "night") -->
  <mask id="cut"><rect width="256" height="256" fill="#fff"/><circle cx="210" cy="52" r="30" fill="#000"/></mask>
  <circle cx="194" cy="62" r="34" fill="url(#moon)" mask="url(#cut)"/>
  <!-- sound waves -->
  <g fill="none" stroke="#35e0ff" stroke-linecap="round" stroke-width="9">
    <path d="M52 112a44 44 0 0 0 12 62" opacity=".95"/>
    <path d="M32 100a68 68 0 0 0 18 92" opacity=".55"/>
  </g>
  <!-- microphone, tilted -->
  <g transform="translate(-18 14) scale(.94) rotate(32 128 138)">
    <rect x="113" y="132" width="30" height="92" rx="15" fill="#fbeeff"/>
    <rect x="113" y="168" width="30" height="10" fill="#35e0ff"/>
    <rect x="94" y="52" width="68" height="96" rx="34" fill="url(#mic)"/>
    <g stroke="#150a22" stroke-opacity=".35" stroke-width="4" stroke-linecap="round">
      <path d="M104 86h48M101 102h54M104 118h48"/>
    </g>
    <ellipse cx="116" cy="76" rx="9" ry="14" fill="#fff" opacity=".35"/>
  </g>
  <!-- sparkles -->
  <path d="M206 168l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="#ffc83d"/>
  <path d="M68 52l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fbeeff"/>
</svg>
